plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// The common sources and the built-in data packs are compiled straight into this jar, the same as the Fabric side.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}
// The in-game test (src/clienttest): part of the mod only in dev runs, never in the jar.
sourceSets {
	clienttest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

neoForge {
	version = project.neoforge_version
	addModdingDependenciesTo(sourceSets.clienttest)

	mods {
		"espresso_flavoured" {
			sourceSet sourceSets.main
			// The same mod as the main sources, so the test can reach the package's own classes.
			sourceSet sourceSets.clienttest
		}
	}

	runs {
		client {
			client()
		}
		// `./gradlew :neoforge:runClientTest`: starts the game, makes a flat world, runs the checks in
		// src/clienttest and closes. A failed check crashes the game, so the task fails. Needs a display.
		clientTest {
			client()
			systemProperty 'espresso_flavoured.clienttest', 'true'
			gameDirectory = project.file('build/run/clientTest')
		}
		server {
			server()
			programArgument '--nogui'
		}
	}
}

dependencies {
	// Spawn Gazebo (Gabby's own mod) builds and protects the gazebo at spawn. It's bundled inside
	// this jar (jar-in-jar), so players don't install it separately, and the chest gets Espresso's
	// own kit (see [modproperties] in neoforge.mods.toml). libs/ holds its release builds.
	implementation ":spawn-gazebo-neoforge:${project.spawn_gazebo_version}"
	jarJar(":spawn-gazebo-neoforge:[${project.spawn_gazebo_version},)") {
		version { prefer project.spawn_gazebo_version }
	}
	// Curios (the NeoForge Trinkets): charms go in its slots when it's installed; not bundled or required.
	// (Modrinth version id of Curios 17.0.0-beta.3 for NeoForge 26.3.)
	compileOnly "maven.modrinth:curios:W912LxOl"
	clienttestCompileOnly "maven.modrinth:curios:W912LxOl"
	// `./gradlew :neoforge:runClientTest -PtestCurios` runs the test with Curios installed, so the charms are
	// worn in its slots instead of the off-hand.
	if (project.hasProperty("testCurios")) {
		runtimeOnly "maven.modrinth:curios:W912LxOl"
	}
	// `-PtestLootr`, `-PtestJade` and `-PtestJei` run the test with those optional mods installed
	// (Modrinth version ids for NeoForge 26.3: Lootr 1.25.42.124, Jade 26.3.5, JEI 31.14.0.72 and the
	// MezzConfig it needs). Not bundled or required.
	if (project.hasProperty("testLootr")) {
		runtimeOnly "maven.modrinth:lootr:PdFGq3vT"
	}
	if (project.hasProperty("testJade")) {
		runtimeOnly "maven.modrinth:jade:dVB8U7Td"
	}
	if (project.hasProperty("testJei")) {
		runtimeOnly "maven.modrinth:jei:kLsKOFxv"
		runtimeOnly "maven.modrinth:mezzconfig:WFeT02Wv"
	}
	// Jade: only for the coffee bush and espresso machine tooltips; not bundled or required.
	compileOnly "maven.modrinth:jade:26.3.5+fabric"
	// JEI: only for the espresso machine's page; not bundled or required.
	compileOnly "maven.modrinth:jei:csqmrfNS"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

tasks.named('jar') { archiveBaseName = "${rootProject.name}-neoforge" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-neoforge" }
