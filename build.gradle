plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	maven { url = 'https://api.modrinth.com/maven' }
}

loom {
	mods {
		"espresso_flavoured" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// Versions are in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Mod Menu: only for the Config button; not bundled or required.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Jade: only for the coffee bush and espresso machine tooltips; not bundled or required.
	compileOnly "maven.modrinth:jade:26.3.5+fabric"
	// JEI: only for the espresso machine's page and the water lily note; not bundled or required.
	// (Modrinth version id of JEI 31.10.0.63 for Fabric 26.3.)
	compileOnly "maven.modrinth:jei:xx7kXPHL"
	// Trinkets Updated: charms go in its slots when it's installed; not bundled or required.
	// (Modrinth version id of Trinkets Updated 4.2.1+26.3.)
	compileOnly "maven.modrinth:trinkets-updated:lVR1OKgV"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Also builds a -sources jar alongside the mod.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("LICENSE-ASSETS") {
		rename { "${it}_$projectName"}
	}
}
